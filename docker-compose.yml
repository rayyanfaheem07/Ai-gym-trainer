services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_gym_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aigym}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aigym}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai_gym_net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ai_gym_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aigym}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production-use-openssl-rand-hex-32}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-30.0}
      - ENVIRONMENT=production
      - DEBUG=false
      - RUN_MIGRATIONS=true
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai_gym_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/stream
    container_name: ai_gym_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai_gym_net

  ollama:
    image: ollama/ollama:latest
    container_name: ai_gym_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai_gym_net

volumes:
  pgdata:
  ollama_models:

networks:
  ai_gym_net:
    driver: bridge

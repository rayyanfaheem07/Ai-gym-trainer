name: CI & Automated Quality Gates

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. SECURITY & SECRET SAFETY GATE
  # =========================================================================
  security:
    name: Security & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify untracked environment files
        run: |
          echo "Checking that sensitive environment files are not tracked in git..."
          if git ls-files --error-unmatch .env .env.local 2>/dev/null; then
            echo "ERROR: Tracked .env or .env.local file detected in git index!"
            exit 1
          fi
          echo "No tracked secret files found in git index."

      - name: Scan repository for accidentally committed private keys
        run: |
          echo "Scanning for accidentally committed private keys or raw certificates..."
          if grep -rnw --exclude-dir={.git,node_modules,.venv,docs} -E "BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY" .; then
            echo "ERROR: Private key pattern detected in repository!"
            exit 1
          fi
          echo "Secret scan passed cleanly."

      - name: Node dependency audit (Production high/critical)
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=critical || true

  # =========================================================================
  # 2. BACKEND QUALITY, TESTS & COVERAGE GATE
  # =========================================================================
  backend:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install system dependencies for OpenCV and MediaPipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1 libgles2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Ruff Linter & Formatting Check
        run: |
          ruff check .

      - name: Run Bandit Static Security Scan
        run: |
          bandit -r backend/ ai/ -ll

      - name: Run Pytest with Coverage Gate (>= 80%)
        run: |
          mkdir -p reports
          pytest --cov=backend/app --cov=ai --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: reports/coverage.xml
          retention-days: 14

  # =========================================================================
  # 3. DATABASE MIGRATIONS VALIDATION (POSTGRESQL)
  # =========================================================================
  migrations:
    name: Alembic Migration Cycle (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: aigym_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1 libgles2

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate migration chain (Upgrade -> Downgrade -> Upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/aigym_ci
        run: |
          echo "===> Step 1: Upgrading to migration head..."
          alembic upgrade head

          echo "===> Step 2: Verifying current migration head..."
          CURRENT_REV=$(alembic current)
          echo "$CURRENT_REV"
          echo "$CURRENT_REV" | grep -q "004_add_performance_indexes" || { echo "Failed to reach head 004"; exit 1; }

          echo "===> Step 3: Testing single-step downgrade..."
          alembic downgrade -1
          DOWNGRADED_REV=$(alembic current)
          echo "$DOWNGRADED_REV"
          echo "$DOWNGRADED_REV" | grep -q "003_add_user_profile_table" || { echo "Failed to downgrade to 003"; exit 1; }

          echo "===> Step 4: Re-upgrading back to head..."
          alembic upgrade head
          FINAL_REV=$(alembic current)
          echo "$FINAL_REV"
          echo "$FINAL_REV" | grep -q "004_add_performance_indexes" || { echo "Final revision is not head 004"; exit 1; }
          echo "Migration cycle passed successfully!"

  # =========================================================================
  # 4. FRONTEND QUALITY & BUILD GATE
  # =========================================================================
  frontend:
    name: Frontend Test, Lint & Standalone Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies (clean install)
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Unit & Integration Tests
        run: |
          cd frontend
          npm test

      - name: Run TypeScript Static Type Check
        run: |
          cd frontend
          npm run typecheck

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build

  # =========================================================================
  # 5. DOCKER & CONTAINER INTEGRITY GATE
  # =========================================================================
  docker:
    name: Docker Build & Compose Integrity
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config --quiet

      - name: Build Backend Production Image
        run: |
          docker compose build backend

      - name: Build Frontend Production Image
        run: |
          docker compose build frontend

      - name: Verify Container Startup & Health
        run: |
          echo "Starting Docker Compose services..."
          docker compose up -d

          echo "Waiting for services to become healthy..."
          RETRIES=20
          until [ $RETRIES -le 0 ]; do
            STATUS_BACKEND=$(docker inspect --format='{{json .State.Health.Status}}' ai_gym_backend 2>/dev/null || echo "\"starting\"")
            STATUS_FRONTEND=$(docker inspect --format='{{json .State.Health.Status}}' ai_gym_frontend 2>/dev/null || echo "\"starting\"")
            echo "Status: backend=$STATUS_BACKEND, frontend=$STATUS_FRONTEND ($RETRIES left)"
            if [ "$STATUS_BACKEND" = "\"healthy\"" ] && [ "$STATUS_FRONTEND" = "\"healthy\"" ]; then
              echo "Containers are healthy!"
              break
            fi
            sleep 5
            RETRIES=$((RETRIES - 1))
          done

          if [ $RETRIES -le 0 ]; then
            echo "ERROR: Containers failed to become healthy within timeout!"
            docker compose ps
            docker compose logs
            exit 1
          fi

          echo "Verifying backend health endpoint response..."
          curl -s -f http://localhost:8000/health || { echo "Backend health probe failed"; exit 1; }

          echo "Verifying frontend HTTP response..."
          curl -s -f -I http://localhost:3000/ || { echo "Frontend HTTP probe failed"; exit 1; }

      - name: Stop and cleanup Compose services
        if: always()
        run: |
          docker compose down -v
